server:
  port: 8091
  servlet:
    context-path: /

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/wms-new?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    # ★ 2026-11-04 安全改造：不再内置真实数据库口令。
    #   本文件会被打进 JAR 并随发布包分发，内置明文口令等于公开凭据。
    #   改为环境变量注入：值来自 /etc/default/camera-detection（640 root:root），
    #   由 systemd 的 EnvironmentFile 传给 JVM。
    #
    #   ⚠️ 2026-11-04 二次修正：原先写成 ${MYSQL_PASSWORD:}（带空默认值），
    #   那样环境变量缺失时应用**能启动但连不上库**，表现为
    #   "服务 active 但业务全错"，极难排查。
    #   现在改成 ${MYSQL_PASSWORD}（**无默认值**）—— 缺失即启动失败，
    #   在日志里明确报 "Could not resolve placeholder 'MYSQL_PASSWORD'"。
    password: ${MYSQL_PASSWORD}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 200
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1 FROM DUAL
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 1024MB

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # OPS-01（2026-11-06）：默认值即安全值。原默认 StdOutImpl 会把全部 SQL 打到 stdout
    # 并进 journald（漏配外部覆盖就是全量 SQL 日志洪灾）。本地调试需要看 SQL 时，
    # 用 --spring.config.additional-location 或启动参数覆盖，不要改回这里的默认值。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    auto-mapping-unknown-column-behavior: NONE
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # ★ 2026-11-04 安全改造：不再内置固定 JWT 密钥（打进 JAR 等于公开）。
  #   现场由 install.sh 生成随机值写入 /etc/default/camera-detection（JWT_SECRET）。
  #   ⚠️ 无默认值：环境变量缺失时启动即失败，避免用公开密钥保护生产。
  secret: ${JWT_SECRET}
  expiration: 86400000

app:
  # 服务安装根目录。Windows 服务启动时会通过 -Dapp.home 指向安装目录；
  # 本地开发未指定时默认写入项目工作目录下 runtime，避免写入 jar 内部。
  home: ${APP_HOME:./runtime}
  upload:
    image-dir: ${app.home}/data/uploads/images
  # ---- 缺陷图片月度归档（2026-11-05）----
  #   主表保留 hot-days 天，更早数据按月移入 defect_image_*_hist_YYYYMM；
  #   磁盘图片保留 retain-days 天（由 cleanup-defect-images.sh 按日期目录删）
  archive:
    images:
      cron: "0 30 2 * * ?"     # 每日 02:30（错开 02:00 的 DataCleanupTask）
      hot-days: 31             # 主表热数据保留天数
      retain-days: 730         # 月表保留天数（2 年），超期整表 DROP
      batch-size: 5000         # 每批搬移行数
  # ---- NEW-02（2026-11-06 v5 评审）：登录/注册限速的客户端 IP 来源 ----
  #   默认空 = **不信任 X-Forwarded-For**，只用 socket 对端地址。
  #   原因：安装脚本不部署 nginx，Spring Boot 直连 8091，XFF 完全由客户端伪造
  #   —— 采信它等于把限速关掉（换一个头就换一个限速桶）。
  #   将来若在应用前加代理，把代理地址填进来（逗号分隔，支持 CIDR）：
  #     trusted-proxies: 127.0.0.1,10.2.77.0/24
  security:
    trusted-proxies: ""

upload:
  path: ${app.home}/data/uploads
  max-file-size: 10MB
  max-request-size: 1024MB

logging:
  level:
    # OPS-01（2026-11-06）：默认 INFO。原默认 DEBUG 会把每条 SQL/参数打进日志文件；
    # 需要排查时在启动参数临时开 --logging.level.com.wms.mapper=DEBUG。
    com.wms.mapper: INFO
  file:
    name: ${app.home}/logs/camera-detection-system.log


server-metrics:
  # 服务器资源指标采集器（OSHI）。
  # 采集在后台定时执行，接口只读内存缓存 —— 实测单次采集 124~214ms
  # （其中 getDiskStores 独占 85~95ms），若在请求时现采，
  # 并发用户会互相打乱磁盘速率的做差基准，算出的速率是错的。
  interval-ms: 5000
  # 启动后延迟多久开始第一次定时采集（@PostConstruct 已先采一次，此处仅影响定时器）
  initial-delay-ms: 1000
  # 内存环形缓存的历史点数。120 点 / 5 秒 = 10 分钟窗口
  history-size: 120

license:
  # ---- 服务器授权（2026-11-12 新增）----
  # 签发工具：installer/linux/scripts/gen_license.py（离线，不联网）
  # 文件格式：base64url(payloadJson) + "." + base64url(hmacSha256(payloadJson))
  # 默认落 data 盘而不是 /etc：应用以 cdsys 运行，/etc 下的 640 root 文件写不进去，
  # 「上传新授权」会永远失败。设计说明见 docs/服务器授权设计.md。
  enabled: true
  # 留空 = 用 LicenseSigner 内置默认密钥。生产可用环境变量 LICENSE_SECRET 覆盖；
  # ⚠ 覆盖后必须用同一密钥重新签发，否则现有授权立刻失效。
  secret: ${LICENSE_SECRET:}
  file: ${app.home}/data/license/license.lic
  # 过期策略（三分支）：
  #   warn     → 只告警、永不阻断（默认。产线不能因为授权到期直接停摆）
  #   readonly → 过宽限期后拒绝设备写入（上传/心跳/batch），管理端照常可用
  #   block    → 在 readonly 基础上再拒绝业务查询，仅留登录与授权管理
  expired-mode: warn
  # 过期后的宽限天数。宽限期内即使 readonly/block 也不拦
  grace-days: 7
  # 剩余天数 <= 该值进入「即将到期」，前端顶部提示 + 日志告警
  warn-days: 30
  # 机器绑定校验。虚拟机批量克隆后指纹会变，排障时可临时关掉
  enforce-machine: true

camera:
  token:
    # 设备令牌严格模式（2026-11-12 新增）
    #   3 个设备端点（心跳 / 批量上报 / 图片上传）在 SecurityConfig 里是 permitAll，
    #   身份靠 cfg_camera_token 校验。现场大量相机尚未配令牌，一律拒绝会让产线停摆，
    #   所以默认 false：
    #     false → 未配置令牌的相机放行 + WARN；配置了但传错 → 拒绝
    #     true  → 未配置令牌的相机也拒绝（运维配齐后一键收紧）
    #   注意：「配了令牌但传错」在两种模式下都拒绝 —— 这正是 2026-11-12 修掉的洞。
    strict: false

defect-image:
  # 单批缺陷图片最大数量。超过 100 张请拆分批次上报。
  # 设备端建议同步传 Header: X-Image-Count，便于服务端在解析图片流前快速拒绝超量请求。
  max-batch-images: 100
  upload:
    dir: ${app.home}/data/uploads/defect-images/

