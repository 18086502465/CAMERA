server:
  port: 8091
  servlet:
    context-path: /

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/wms-new?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: CCshenda889
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 100
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 1024MB

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 必须显式覆盖：JAR 内置的 application.yml（开发版）里带
    #   log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 它会把**每一条 SQL** 直接打到 stdout。外部配置若不覆盖这一项，
    # 内部配置就会生效 —— 实测 journald 里 95% 的行是 SQL 打印，
    # 几小时就把 journald 撑到 243MB。
    # 改成 Slf4jImpl 后由 logback 按级别控制；MyBatis 的 SQL 是 DEBUG 级，
    # 而本文件 root=INFO，DEBUG 不会输出。
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    auto-mapping-unknown-column-behavior: NONE
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: mySecretKey123456789012345678901234567890
  expiration: 86400000

app:
  # Windows 服务启动时会通过 -Dapp.home 指向安装向导中选择的工作路径。
  # 日志、图片上传、运行数据默认落在该工作路径下。
  home: ${APP_HOME:./}
  upload:
    image-dir: ${app.home}/data/uploads/images
  # 清理任务（DataCleanupTask）的 cron 表达式。
  # 默认每天 02:00 —— 晚于数据库备份（01:00）、早于图片清理 cron（03:30）。
  # 排查问题时可临时改成高频（如 "0 * * * * ?" 每分钟）验证清理链路，验证完改回。
  cleanup:
    cron: "0 0 2 * * ?"

upload:
  path: ${app.home}/data/uploads
  max-file-size: 10MB
  max-request-size: 1024MB

defect-image:
  # 单批缺陷图片最大数量。超过 100 张请拆分批次上报。
  # 设备端建议同步传 Header: X-Image-Count，便于服务端在解析图片流前快速拒绝超量请求。
  max-batch-images: 100
  upload:
    # 缺陷图片落盘根目录。
    # 路径规则：<此目录>/yyyyMMdd/<cameraId>/HHmmssSSS_<uuid8>.<ext>（已按日期+相机分目录）
    #
    # 容量提示（实测，20 相机 × 5 张/分钟 = 144000 张/天）：
    #   单张 350 KB → 日增 48 GB；放在 50G 的 /var 上约 1 天就写满。
    #   因此生产环境应指向大容量独立分区（实测机 /data 为 500G XFS）。
    #   留空则回落到 ${app.home}/data/uploads/defect-images/。
    dir: /data/camera-detection/images/defect-images/

logging:
  level:
    root: INFO
    com.wms: INFO
    # 必须显式覆盖：JAR 内置的开发版 application.yml 里带 `com.wms.mapper: DEBUG`。
    # logback 取**最具体**的 logger 级别，com.wms.mapper 比 com.wms 更具体，
    # 所以只写 `com.wms: INFO` 压不住它 —— 每条 SQL 仍会打到 stdout。
    # 实测：未覆盖时 journald 里 95% 的行是 SQL 打印，几小时撑到 243MB。
    com.wms.mapper: INFO
  file:
    name: ${app.home}/logs/camera-detection-system.log
