name: CI

# ============================================================
# 产线缺陷在线AI检测系统 —— 持续集成
# ============================================================
# 目标：把「构建与测试全靠人工」变成「每次提交自动验证」。
#   本仓库此前没有任何 CI，任何一次提交都可能带病上线。
#
# 触发时机：
#   - push 到 main：完整验证（测试 + 构建 + 静态检查）
#   - pull_request：验证改动不破坏既有功能
#   - 手动触发（workflow_dispatch）：可指定分支
#
# 说明：
#   本仓库的发布产物（tar.gz / JAR）仍入库在 dist-release/，
#   等 Release 工作流落地后再改为 Artifacts 分发。
# ============================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # 同一分支的新提交取消旧的未完成构建，避免浪费配额
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端构建与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Maven 构建（跳过测试）
        run: mvn -B -ntp -DskipTests clean package
        working-directory: fact-product

      - name: 运行单元测试
        run: mvn -B -ntp test
        working-directory: fact-product

      - name: 上传 JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: fact-product/target/time-bucket-demo.jar
          retention-days: 7

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ★ 用 npm ci 而不是 npm install：
      #   npm ci 严格按 package-lock.json 安装，能保证 CI 与本地构建产物一致；
      #   npm install 可能静默更新 lock，导致"昨天还好好的"。
      - name: 安装依赖
        run: npm ci
        working-directory: frontend

      - name: 构建（含 element-plus guard 检查）
        run: npx vite build
        working-directory: frontend

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  static-check:
    name: 静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 硬编码口令检查
        run: |
          # 仓库里不允许出现明文口令（数据库口令、服务器 SSH 口令等）。
          #
          # ★ 这里扫**全仓**，不是只看本次变更集。原因是曾经这么写过：
          #   CHANGED=$(git diff --name-only HEAD~1 HEAD)
          #   但 checkout 默认 fetch-depth=1 是**浅克隆**，HEAD~1 不存在 →
          #   git diff 报错 → CHANGED 为空 → 代码"兜底"回退成扫全仓。
          #   而兜底分支没有排除 sanitize_secrets.py（清理工具的替换规则表里
          #   必须写字面量）→ 恒定报红，谁都没注意。
          #   改成依赖变更集只会把「多 commit 直推时漏掉前几个 commit」变成新坑，
          #   而全仓扫描实测只要几秒、且当前已干净，就不绕这个弯了。
          #
          # ★ 口令串用 printf 拼接，不能写字面量：否则本文件自己被扫到，
          #   只要 ci.yml 出现在变更集里，这个 job 就会 100% 自我命中报红。
          PAT=$(printf 'CCsh%s889|Pass@%s' 'enda' '1234')
          echo "::group::扫描全仓明文口令"
          FOUND=0
          while IFS= read -r f; do
            case "$f" in
              # 二进制/归档不含可读口令，跳过以省时间
              *.png|*.jpg|*.jpeg|*.gif|*.ico|*.jar|*.tar.gz|*.zip|*.woff|*.woff2|*.ttf) continue ;;
              # 清理工具本身：它的替换规则表里必须有口令字面量，否则没法做替换
              docs/scripts/sanitize_secrets.py) continue ;;
            esac
            [ -f "$f" ] || continue
            if grep -lE "$PAT" "$f" >/dev/null 2>&1; then
              echo "❌ $f 含明文口令"
              FOUND=1
            fi
          done < <(git ls-files)
          echo "::endgroup::"
          if [ "$FOUND" -ne 0 ]; then
            echo "::error::检测到明文口令，请改用环境变量读取"
            exit 1
          fi
          echo "✅ 未发现明文口令"

      - name: Shell 脚本行尾检查
        run: |
          # Windows 上写的 .sh 传到 Linux 会报 "set: pipefail: invalid option name"，
          # 必须在提交前拦住 CRLF。
          echo "::group::检查 shell 脚本行尾"
          BAD=0
          for f in $(git ls-files '*.sh'); do
            if grep -qU $'\r' "$f" 2>/dev/null; then
              echo "❌ $f 是 CRLF 行尾"
              BAD=1
            fi
          done
          echo "::endgroup::"
          if [ "$BAD" -ne 0 ]; then
            echo "::error::存在 CRLF 行尾的 shell 脚本"
            exit 1
          fi
          echo "✅ shell 脚本行尾均为 LF"

      - name: 前端禁止残留 TODO 假数据
        run: |
          # 假数据会让现场把模拟结果当成真实数据判读。
          echo "::group::检查前端假数据残留"
          if grep -rn "TODO: 替换为真实 API" frontend/src/ 2>/dev/null; then
            echo "::error::前端仍有使用模拟数据的 TODO，请接入真实 API"
            exit 1
          fi
          echo "✅ 无假数据 TODO"

      - name: Java 8 API 兼容性检查
        run: |
          # 项目强制 Java 8（maven.compiler.source/target=8），CI 用 JDK 8 编译。
          # 但本机若用 JDK 9+ 编译，javac 会**放行** Java 9+ API（只是 -source 8 的语法检查），
          # 于是「本机全绿、CI testCompile 直接失败」。历史上就是这样漏进 List.of() 的。
          # 这里用文本扫描兜住最常被误用的几个 API。
          echo "::group::扫描 Java 9+ API"
          PATTERN='List\.of\(|Set\.of\(|Map\.of\(|Map\.entry\(|\.isBlank\(\)|\.strip\(\)|\.repeat\(|readAllBytes|readString\(|writeString\(|transferTo\(.*OutputStream|Collectors\.toUnmodifiable|Optional<[^>]*>[^;]*\.isEmpty\(\)|^[[:space:]]*var[[:space:]]+[a-zA-Z]'
          HITS=$(grep -rnE "$PATTERN" fact-product/src --include=*.java | grep -v '/target/' || true)
          echo "::endgroup::"
          if [ -n "$HITS" ]; then
            echo "$HITS"
            echo "::error::检测到 Java 9+ API，JDK 8 无法编译；请改用 Java 8 等价写法"
            exit 1
          fi
          echo "✅ 未发现 Java 9+ API"

      - name: 实体与建库脚本列对账
        run: |
          # fact_anomaly_alert 曾出现「实体有新列、01 建库脚本是旧形状、靠 04 的裸 ALTER 补」
          # 的情况：全新库能跑、现场库取决于 04 有没有跑全，缺列时错误还会被
          # catch(DataAccessException) 吞掉（表现为「告警永远不恢复」）。
          python3 docs/scripts/check_entity_vs_ddl.py

  verify:
    name: 产物一致性校验
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: 同步前端产物到后端静态资源
        run: |
          rm -rf fact-product/src/main/resources/static
          mkdir -p fact-product/src/main/resources/static
          cp -r frontend/dist/* fact-product/src/main/resources/static/
          echo "静态资源文件数: $(ls fact-product/src/main/resources/static/assets | wc -l)"

      - name: 重新打包（验证产物可正常构建）
        run: mvn -B -ntp -DskipTests clean package
        working-directory: fact-product

      - name: 校验 JAR 内前端产物已更新
        run: |
          # 只看「index.html 实际引用的那一个入口 chunk」是否在 JAR 里。
          # 不能用 glob 找 index-*.js：build-release.sh 会保留 3 个历史版本，
          # JAR 里同时躺着十几个 index-*.js，glob 命中不代表是当前入口。
          python3 - <<'PY'
          import zipfile, re, sys
          z = zipfile.ZipFile('fact-product/target/time-bucket-demo.jar')
          names = set(z.namelist())
          idx = [n for n in names if n.endswith('static/index.html')]
          if not idx:
              print('❌ JAR 内缺少 static/index.html'); sys.exit(1)
          html = z.read(idx[0]).decode('utf-8')
          # ★ findall 的匹配结果自带 'assets/' 前缀，拼路径时不能再补一次 assets/，
          #   否则得到 static/assets/assets/index-xxx.js，恒不存在（本 job 曾因此长期报红）。
          entry = re.findall(r'assets/index-[A-Za-z0-9_-]+\.js', html)
          if not entry:
              print('❌ index.html 未引用入口 chunk'); sys.exit(1)
          target = 'BOOT-INF/classes/static/' + entry[0]
          if target not in names:
              print(f'❌ 入口 chunk 未打进 JAR: {target}'); sys.exit(1)
          total = len([n for n in names if n.startswith('BOOT-INF/classes/static/')])
          print(f'✅ 入口 {entry[0]} 已正确打进 JAR（static 资源 {total} 项）')
          PY

      - name: 上传最终 JAR
        uses: actions/upload-artifact@v4
        with:
          name: camera-detection-jar
          path: fact-product/target/time-bucket-demo.jar
          retention-days: 14
